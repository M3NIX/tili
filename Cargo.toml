[package]
name = "tili"
version = "0.3.4"
edition = "2024"
description = "A minimal i3-inspired terminal tiling manager"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
arboard = { version = "3.7.0", default-features = false }
crossterm = { version = "0.29.0", features = ["osc52"] }
libc = "0.2.191"
ssh2-config = { version = "0.9", default-features = false }
nucleo-matcher = "0.3.1"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
toml = "1.1.8"
tastty-core = { version = "0.1.1", features = ["crossterm"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
